<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom 2D Perlin Noise Min/Max Visualisation</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: auto;
            gap: 20px;
            margin-bottom: 20px;
            background-color: antiquewhite;
        }

        .bitmap-canvas {
            width: 200px;
            height: auto;
        }
    </style>
</head>
<body>
    <div>
        <h1>Custom 2D Perlin Noise Min/Max Visualisation</h1>
        <input type="checkbox" id="doDrawGridLines">
        <label for="doDrawGridLines">Draw Gridlines?</label>
        <p>Select a Colour Mode:</p>
        <label><input type="radio" name="colour-mode" value="greyscale" checked>Greyscale</label>
        <label><input type="radio" name="colour-mode" value="blue-yellow">Blue-yellow</label>
        <label><input type="radio" name="colour-mode" value="blue-purple-red">Blue-purple-red</label>
        <label><input type="radio" name="colour-mode" value="heatmap">Rainbow heatmap</label>
        <label><input type="radio" name="colour-mode" value="viridis">Viridis (colourblind-friendly)</label>
    </div>
    <div id="buttonsDiv" class="grid-container">
        <button id="generateBtn">Generate Perlin Noise</button>
    </div>
    <div id="amplitude1Div" class="grid-container"></div>

    <script>
        // 1. Define dimensions
        const width = 1024;
        const height = 1024;

        // Define number of octaves to draw and then add up, as well as the array to store canvas data

        // Locate parent div
        const amplitude1Div = document.getElementById("amplitude1Div");

        // 2. Define the different canvases to draw Perlin noise on
        var gradient_count;
        var dimension_count;
        var doDrawGridLines;
        var globalSelectedTheme;
        chooseRandom256AngleGradient = false;
        doSmoothstep = true;
        doCubicSmoothstep = false;
        const SQRT2 = Math.sqrt(2);
        const SQRT6DIV3 = Math.sqrt(6) / 3;

        // 3. Initialise the GRADIENT array and hash table
        range_2d = 1;
        const GRADIENT_2D_CARDINAL = [
            [range_2d * SQRT2, 0],
            [0, range_2d * SQRT2],
            [-range_2d * SQRT2, 0],
            [0, -range_2d * SQRT2]
        ];
        
        const GRADIENT_2D_DIAGONAL =[
            [-1, -1],
            [1, -1],
            [-1, 1],
            [1, 1]
        ];

        range_2d_both = 1;
        const GRADIENT_2D_BOTH =[
            [range_2d_both, range_2d_both],
            [range_2d_both, -range_2d_both],
            [-range_2d_both, range_2d_both],
            [-range_2d_both, -range_2d_both],
            [range_2d_both * SQRT2, 0],
            [0, range_2d_both * SQRT2],
            [-range_2d_both * SQRT2, 0],
            [0, -range_2d_both * SQRT2]
        ];

        range_3d = 1;
        const GRADIENT_3D = [
            [0, range_3d * SQRT6DIV3, range_3d * SQRT6DIV3],
            [0, range_3d * SQRT6DIV3, -range_3d * SQRT6DIV3],
            [0, -range_3d * SQRT6DIV3, range_3d * SQRT6DIV3],
            [0, -range_3d * SQRT6DIV3, -range_3d * SQRT6DIV3],
            [range_3d * SQRT6DIV3, 0, range_3d * SQRT6DIV3],
            [range_3d * SQRT6DIV3, 0, -range_3d * SQRT6DIV3],
            [-range_3d * SQRT6DIV3, 0, range_3d * SQRT6DIV3],
            [-range_3d * SQRT6DIV3, 0, -range_3d * SQRT6DIV3],
            [range_3d * SQRT6DIV3, range_3d * SQRT6DIV3, 0],
            [range_3d * SQRT6DIV3, -range_3d * SQRT6DIV3, 0],
            [-range_3d * SQRT6DIV3, range_3d * SQRT6DIV3, 0],
            [-range_3d * SQRT6DIV3, -range_3d * SQRT6DIV3, 0]
        ];

        GRADIENT_SELECTED = GRADIENT_2D_DIAGONAL;

        HASH = [135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,
            190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,
            49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,
            251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,
            129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,
            223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,
            138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180,
            131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,
            88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,
            77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,
            102,143,54, 65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,
            5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,
            151,160,137,91,90,15
            ];

        function gradientFrom256Angle(angle) {
            return [SQRT2 * Math.cos(angle * Math.PI / 128), SQRT2 * Math.sin(angle * Math.PI / 128)];
        }

        function minMaxGradient(x_grid_coordinate, y_grid_coordinate) {
            return GRADIENT_2D_DIAGONAL[(y_grid_coordinate & 1) * 2 + (x_grid_coordinate & 1)]
        };
        
        function dotProduct(a, b) {
            return a[0] * b[0] + a[1] * b[1];
        };

        function smoothstep(x) {
            return ((6 * x - 15) * x + 10) * x * x * x;
        };

        function cubicSmoothstep(x) {
            return (3 - 2 * x) * x * x
        }

        function lerp1D(left, right, alpha) {
            return left + (right - left) * alpha;
        };

        function deleteOldCanvases() {
            // 1. Select all canvas elements on the page
            const canvases = document.querySelectorAll('canvas');

            // 2. Loop through each canvas and remove it from the DOM
            canvases.forEach(canvas => canvas.remove());
        }

        function createNewCanvas(parentDiv, ID) {
            // Create a new canvas object to fill in
            const newCanvas = document.createElement("canvas");

            // Configure the canvas
            newCanvas.classList.add("bitmap-canvas"); // Add a CSS class
            newCanvas.id = ID; // Set an 
            newCanvas.width = width;
            newCanvas.height = height;
            ctx = newCanvas.getContext('2d');
            imageData = ctx.createImageData(width, height);

            // Append to the body
            parentDiv.append(newCanvas);

            // Return the array of pixel RGBA values
            return imageData;
        };

        function setDataRGBA(dataRGBAArray, pre_index, intensity) {
            const index = pre_index * 4;
            switch (globalSelectedTheme) {
                case "greyscale":
                    dataRGBAArray[index] = intensity;
                    dataRGBAArray[index + 1] = intensity;
                    dataRGBAArray[index + 2] = intensity;
                    dataRGBAArray[index + 3] = 255;
                    break;
                case "blue-yellow":
                    dataRGBAArray[index] = intensity;
                    dataRGBAArray[index + 1] = intensity;
                    dataRGBAArray[index + 2] = 255 - intensity;
                    dataRGBAArray[index + 3] = 255;
                    break;
                case "blue-purple-red":
                    dataRGBAArray[index] = intensity;
                    dataRGBAArray[index + 1] = 0;
                    dataRGBAArray[index + 2] = 255 - intensity;
                    dataRGBAArray[index + 3] = 255;
                    break;
                case "heatmap":
                    // Clamp intensity between 0 and 255
                    const val = Math.max(0, Math.min(255, intensity));
                    const ratio = val / 255;

                    // Define control points for gradient: Blue -> Cyan -> Yellow -> Red
                    const colors = [
                        { r: 0,   g: 0,   b: 255 }, // Blue (0)
                        { r: 0,   g: 255, b: 255 }, // Cyan (85)
                        { r: 255, g: 255, b: 0   }, // Yellow (170)
                        { r: 255, g: 0,   b: 0   }  // Red (255)
                    ];

                    // Scale ratio to segment index
                    const scaled = ratio * (colors.length - 1);
                    const segment_index = Math.floor(scaled);
                    const t = scaled - segment_index;

                    if (segment_index >= colors.length - 1) {
                        const c = colors[colors.length - 1];
                        dataRGBAArray[index] = c.r;
                        dataRGBAArray[index + 1] = c.g;
                        dataRGBAArray[index + 2] = c.b;
                        dataRGBAArray[index + 3] = 255;
                        break;
                    }

                    const c1 = colors[segment_index];
                    const c2 = colors[segment_index + 1];

                    const r = Math.round(c1.r + t * (c2.r - c1.r));
                    const g = Math.round(c1.g + t * (c2.g - c1.g));
                    const b = Math.round(c1.b + t * (c2.b - c1.b));

                    dataRGBAArray[index] = r;
                    dataRGBAArray[index + 1] = g;
                    dataRGBAArray[index + 2] = b;
                    dataRGBAArray[index + 3] = 255;
                    break;
                case "viridis":
                    // Clamp intensity between 0 and 255
                    const v_val = Math.max(0, Math.min(255, intensity));
                    const v_ratio = v_val / 255;

                    // Key control points for the Viridis colormap
                    const v_colors = [
                        { r: 68,  g: 1,   b: 84  }, // 0.0 - Dark Purple
                        { r: 59,  g: 82,  b: 139 }, // 0.25 - Dark Blue
                        { r: 33,  g: 145, b: 140 }, // 0.50 - Teal
                        { r: 94,  g: 201, b: 98  }, // 0.75 - Green
                        { r: 253, g: 231, b: 37  }  // 1.0 - Yellow
                    ];

                    // Scale ratio to segment index
                    const v_scaled = v_ratio * (v_colors.length - 1);
                    const v_segment_index = Math.floor(v_scaled);
                    const v_t = v_scaled - v_segment_index;

                    if (v_segment_index >= v_colors.length - 1) {
                        const c = v_colors[v_colors.length - 1];
                        dataRGBAArray[index]     = c.r;
                        dataRGBAArray[index + 1] = c.g;
                        dataRGBAArray[index + 2] = c.b;
                        dataRGBAArray[index + 3] = 255;
                    } else {
                        const c1 = v_colors[v_segment_index];
                        const c2 = v_colors[v_segment_index + 1];

                        const r = Math.round(c1.r + v_t * (c2.r - c1.r));
                        const g = Math.round(c1.g + v_t * (c2.g - c1.g));
                        const b = Math.round(c1.b + v_t * (c2.b - c1.b));

                        dataRGBAArray[index]     = r;
                        dataRGBAArray[index + 1] = g;
                        dataRGBAArray[index + 2] = b;
                        dataRGBAArray[index + 3] = 255;
                    }
                    break;
                return
            };
        };

        function setGridLineRGBA(dataRGBAArray, pre_index) {
            const index = pre_index * 4
            dataRGBAArray[index]     = 224;
            dataRGBAArray[index + 1] = 224;
            dataRGBAArray[index + 2] = 224;
            dataRGBAArray[index + 3] = 255;
        };

        function drawGradientArrows(ctx, period, width, height, useRandomAngles, gradSelected) {
            // --- Customization Variables ---
            const arrowThickness = period / 32;       // Thickness of the arrow line
            const arrowColor = "rgba(255, 0, 0, 1)"; // Arrow color and opacity

            ctx.strokeStyle = arrowColor;
            ctx.fillStyle = arrowColor;
            ctx.lineWidth = arrowThickness;
            ctx.lineCap = "round"; // Gives the line a smooth rounded end just in case

            // Calculate how many grid columns and rows fit on the canvas
            const cols = Math.ceil(width / period) + 1;
            const rows = Math.ceil(height / period) + 1;

            // Scale arrow length and arrowhead size relative to the period
            const arrowLengthScale = period * 0.35;
            const headLength = period * 0.08; // Scales the ">" pointer size with the period

            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    const gx = i * period;
                    const gy = j * period;

                    // Get the gradient vector based on your current settings
                    let grad = minMaxGradient(i, j);

                    const dx = grad[0] * arrowLengthScale;
                    const dy = grad[1] * arrowLengthScale;
                    const length = Math.sqrt(dx * dx + dy * dy);

                    if (length === 0) continue;

                    // Calculate unit vector direction
                    const ux = dx / length;
                    const uy = dy / length;

                    const tipX = gx + dx;
                    const tipY = gy + dy;

                    // Shorten the line endpoint so it stops short of the absolute tip,
                    // preventing the line's flat edge from squaring off the arrowhead.
                    const lineEndX = tipX - ux * (headLength * 0.6);
                    const lineEndY = tipY - uy * (headLength * 0.6);

                    // 1. Draw the main gradient vector line (stopping short of the tip)
                    ctx.beginPath();
                    ctx.moveTo(gx, gy);
                    ctx.lineTo(lineEndX, lineEndY);
                    ctx.stroke();

                    // 2. Draw the arrowhead (">" pointer) cleanly over the line end
                    const angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(tipX, tipY);
                    ctx.lineTo(
                        tipX - headLength * Math.cos(angle - Math.PI / 6),
                        tipY - headLength * Math.sin(angle - Math.PI / 6)
                    );
                    ctx.lineTo(
                        tipX - headLength * Math.cos(angle + Math.PI / 6),
                        tipY - headLength * Math.sin(angle + Math.PI / 6)
                    );
                    ctx.lineTo(tipX, tipY);
                    ctx.fill();

                    // 3. Draw a small dot at the exact grid intersection point
                    ctx.beginPath();
                    ctx.arc(gx, gy, arrowThickness, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    </script>
    <script>
        document.getElementById('generateBtn').addEventListener('click', () => {

            doDrawGridLines = document.getElementById("doDrawGridLines").checked
            globalSelectedTheme = document.querySelector('input[name="colour-mode"]:checked')?.value;

            deleteOldCanvases();

            for (let i = 0; i < 3; i++) {
                // Set Perlin noise parameters
                period = 128;
                amplitude = 1;
                amplitude1ID = "amplitude" + i.toString();
                doSmoothStep = true;

                amplitude1ImageData = createNewCanvas(amplitude1Div, amplitude1ID);
                amplitude1DataRGBA = new Uint8ClampedArray(width * height * 4);

                // Now that parameters have been set and the canvas can be drawn on, we run the actual Perlin noise algorithm
                for (let y = 0; y < height; y++) {

                    for (let x = 0; x < width; x++) {
                        // Calculate the array index for the current pixel
                        index = y * width + x;

                        // Find the grid cell numbers and x and y coordinates ∈ [0, 1) within these grid 'cells'
                        x_mod = ((x % period) + period) % period;
                        y_mod = ((y % period) + period) % period;
                        x_grid_coordinate = (x - x_mod) / period;
                        y_grid_coordinate = (y - y_mod) / period;
                        x_relative = x_mod / period;
                        y_relative = y_mod / period;

                        if (doDrawGridLines && (Math.min(Math.abs(x_relative), Math.abs(1 - x_relative)) < 0.02 || Math.min(Math.abs(y_relative), Math.abs(1 - y_relative)) < 0.02)) {
                            setGridLineRGBA(amplitude1DataRGBA, index);
                            continue;
                        };

                        // Select a random direction for the gradient vector, based on 256 equally spaced angles
                        n00 = dotProduct(minMaxGradient(x_grid_coordinate, y_grid_coordinate), [x_relative, y_relative]);
                        n01 = dotProduct(minMaxGradient(x_grid_coordinate, y_grid_coordinate + 1), [x_relative, y_relative - 1]);
                        n10 = dotProduct(minMaxGradient(x_grid_coordinate + 1, y_grid_coordinate), [x_relative - 1, y_relative]);
                        n11 = dotProduct(minMaxGradient(x_grid_coordinate + 1, y_grid_coordinate + 1), [x_relative - 1, y_relative - 1]);

                        // Apply the quintic smootherstep function to transform the noise values along the edges of the grid, to avoid discontinuities
                        if (i == 0) {
                            x_alpha = smoothstep(x_relative);
                            y_alpha = smoothstep(y_relative);
                        } else if (i == 1) {
                            x_alpha = cubicSmoothstep(x_relative);
                            y_alpha = cubicSmoothstep(y_relative);
                        } else {
                            x_alpha = x_relative;
                            y_alpha = y_relative;
                        };

                        // Linearly interpolate to find the equivalent noise value based on the dot products as if they existed at each respective grid point
                        noise_raw = lerp1D(lerp1D(n00, n01, y_alpha), lerp1D(n10, n11, y_alpha), x_alpha);
                        //console.log(noise_raw)

                        // Dilate the noise values to the RGB intensity range [-128, 128] * amplitude
                        noise_dilated = noise_raw * 128 * amplitude;

                        // Translate these noise values to the range [0, 256]
                        noise_final = noise_dilated + 128;

                        // Find the noise value without multiplying by amplitude
                        noise_amplitude_1 = (noise_raw + 1) * 128;

                        // Use the noise intensity value ∈ [0, 255] to set the pixel brightness values
                        setDataRGBA(amplitude1DataRGBA, index, noise_amplitude_1)
                    };
                };

                // Draw the Perlin noise data onto the canvas
                amplitude1Context = document.getElementById(amplitude1ID).getContext('2d');
                amplitude1ImageData.data.set(amplitude1DataRGBA);
                amplitude1Context.putImageData(amplitude1ImageData, 0, 0);
                drawGradientArrows(amplitude1Context, period, width, height, chooseRandom256AngleGradient, GRADIENT_SELECTED);

                // Reset special Perlin noise parameters
                chooseRandom256AngleGradient = false;
                doSmoothStep = true;
                doCubicSmoothstep = false;
            };
        });
    </script>
